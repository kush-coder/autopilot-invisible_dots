# Configuration only: nothing in this repository is a Python package. The
# pre-push hook and CI run the English and claims gates of the pinned
# invisible-core (.github/gates-requirements.txt), and those gates read their
# settings from this file.

# Which gates `.githooks/pre-push` hands over to invisible_core.hooks. The
# suites of this repository (vitest and go test) run in the hook itself before
# that, so the core's pytest gate is off; `pin` is off because nothing here
# pins invisible-core in a package manifest, and there are no release tags
# because nothing is published to an index.
[tool.invisible.hooks]
pytest = false
pin = false
english = true
identity = true
release_tags = []

# The gate's own default list, then every kind of file this repository writes
# prose in. `.mjs` is listed on its own because the gate matches by suffix and
# "build.mjs" does not end in ".js".
[tool.invisible.english]
extensions = [
    ".py", ".md", ".toml", ".cfg", ".yml", ".yaml", ".js", ".css", ".html",
    ".ts", ".tsx", ".mts", ".cts", ".mjs", ".go", ".sh", ".sql", ".service", "Dockerfile",
]
excluded = []
