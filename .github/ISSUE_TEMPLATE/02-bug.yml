name: Bug report
description: A Dot, the web UI, the command line, the API or a channel does something wrong
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you asked or did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: The message or task you gave the Dot, or the steps in the UI or the command line.
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - Web UI
        - Command line
        - HTTP API
        - Telegram
        - WhatsApp
        - The Dot's computer or browser
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit and host
      placeholder: "a0bc3a64, Windows 11"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model
      placeholder: z-ai/glm-5.3-flash
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`invisible-dots logs <dot> --tail 200 --no-follow`, and the server's output around the failure. Remove keys and personal data."
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: Searched existing issues.
          required: true
        - label: Removed keys, tokens and personal data.
          required: true
