name: Setup failure
description: "setup, doctor, the images or the server fail before you can talk to a Dot"
title: "[setup] "
labels: ["bug", "setup"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when the host never gets to a working Dot. If a Dot runs but does something wrong, use the bug report.
        The guide's [troubleshooting](https://github.com/feder-cr/invisible_dots/blob/main/docs/guide.md#troubleshooting) covers the common failures.

  - type: dropdown
    id: os
    attributes:
      label: Host
      options:
        - Windows 11 (Windows Hypervisor Platform)
        - Windows 10
        - Ubuntu 24.04 (KVM)
        - Other Linux
        - Other
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: invisible-dots doctor
      description: The full output of `node apps/cli/dist/invisible-dots.mjs doctor`.
      render: text
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What you ran and what happened
      description: The command, and its output verbatim. Remove keys and personal paths.
      render: text
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: Searched existing issues.
          required: true
        - label: On the latest `main`.
          required: true
        - label: Removed keys, tokens and personal paths.
          required: true
