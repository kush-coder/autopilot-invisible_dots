name: Feature request
description: Something a Dot, the web UI or the command line should do
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What you want to do
      description: The task or the situation, in your words. What a Dot should be able to do, not how to build it.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: What you tried, and where it stops.
    validations:
      required: false

  - type: textarea
    id: idea
    attributes:
      label: An idea of how
      description: Optional.
    validations:
      required: false
